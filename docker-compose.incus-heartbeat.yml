services:
  incus-heartbeat:
    image: kiiro-host-worker:incus-monitor-v1
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      INCUS_MONITOR_ENABLED: "true"
      INCUS_COMPUTE_ENABLED: "false"
      MOCK_COMPUTE_ENABLED: "false"
      INCUS_NODE_ID: incus-test-node-01
      INCUS_API_URL: https://incus-01-test:8443
      INCUS_CLIENT_CERT_PATH: /etc/kiiro-host/incus/client.crt
      INCUS_CLIENT_KEY_PATH: /etc/kiiro-host/incus/client.key
      INCUS_SERVER_CERT_PATH: /etc/kiiro-host/incus/server.crt
      INCUS_SERVER_FINGERPRINT: adf416d3d7e2960d42e6eb33e8236d2d95bc0e730bd7724cc9afc20d211002e7
      DATABASE_URL: postgresql://${POSTGRES_USER:-kiiro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kiiro_host}?schema=public
    command: ["node", "apps/worker/dist/incus-monitor-standalone.js"]
    volumes:
      - /etc/kiiro-host/incus:/etc/kiiro-host/incus:ro
    extra_hosts:
      - "incus-01-test:185.136.186.101"
    networks:
      - backend

networks:
  backend:
    external: true
    name: kiiro-host_backend
