name: Console Private Bridge CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/modules/compute/console-*'
      - 'apps/worker/src/incus-console-*'
      - 'apps/worker/src/incus-client.ts'
      - 'apps/worker/src/incus-managed-standalone.ts'
      - 'tests/console-bridge.test.ts'
      - 'package-lock.json'
      - '.github/workflows/console-private-bridge-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kiiro_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - run: npx tsx --test tests/console-bridge.test.ts tests/console-protocol.test.ts tests/console-websocket.test.ts
      - run: npm run build -w @kiiro/api
      - run: npm run build -w @kiiro/worker
